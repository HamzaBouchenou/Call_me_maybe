[project]
name = "call-me-maybe"
version = "0.0.1"
description = "Introduction to function calling in LLM's"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "llm-sdk",
    "numpy",
    "pydantic",
    "flake8",
    "mypy",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.mypy]
follow_imports = "skip"